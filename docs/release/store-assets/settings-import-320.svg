<svg xmlns="http://www.w3.org/2000/svg" width="420" height="730" viewBox="0 0 420 730">
<defs>
    <style>
      .canvas{fill:#e9e2d5}.panel{fill:#fffdf8;stroke:#d8cebd;stroke-width:1}.bar{fill:#f6f0e5}.ink{fill:#18212b}.muted{fill:#66707a}.accent{fill:#3154a5}.accentSoft{fill:#e8edfa}.success{fill:#1f7257}.successSoft{fill:#e4f2ec}.warn{fill:#9b5a1d}.warnSoft{fill:#fff0d8}.danger{fill:#ad3b42}.dangerSoft{fill:#fae9ea}.rule{stroke:#d8cebd;stroke-width:1}.focus{fill:none;stroke:#3154a5;stroke-width:3}.card{fill:#fffdf8;stroke:#d8cebd;stroke-width:1}.dark{fill:#18212b}.white{fill:#fffdf8}.t{font-family:'Cairo',sans-serif;direction:rtl;unicode-bidi:plaintext}.h1{font-size:25px;font-weight:700}.h2{font-size:19px;font-weight:700}.body{font-size:14px;font-weight:500}.small{font-size:12px;font-weight:500}.tiny{font-size:10px;font-weight:600;letter-spacing:.3px}.num{font-family:'Cairo',sans-serif;font-variant-numeric:tabular-nums}.button{fill:#3154a5}.buttonText{fill:#fffdf8;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;direction:rtl}.outline{fill:#fffdf8;stroke:#3154a5;stroke-width:1.5}.field{fill:#fffdf8;stroke:#bdb3a3;stroke-width:1.2}.screenLabel{font-family:'Cairo',sans-serif;font-size:15px;font-weight:700;fill:#39424c;direction:rtl}.chip{fill:#eef1f4}.dot{fill:#3154a5}.coverA{fill:#3154a5}.coverB{fill:#b56924}.coverC{fill:#4b7a69}
    </style>
  </defs>
<g transform="translate(0 0)">
    <text x="420" y="-18" text-anchor="end" class="screenLabel">10 — الإعدادات والبيانات</text>
    <rect class="panel" width="420" height="730" rx="16"/>
    <rect class="bar" width="420" height="66" rx="16"/><rect class="bar" y="48" width="420" height="18"/><text x="390" y="41" text-anchor="end" class="t h2 ink">الإعدادات والبيانات</text>
    <text x="390" y="108" text-anchor="end" class="t h2 ink">المظهر</text>
    <g transform="translate(30 126)"><rect width="360" height="62" rx="11" class="card"/><text x="330" y="37" text-anchor="end" class="t body ink">السمة</text><rect x="28" y="14" width="118" height="34" rx="17" class="accentSoft"/><text x="87" y="36" text-anchor="middle" class="t small accent">حسب النظام</text></g>
    <text x="390" y="232" text-anchor="end" class="t h2 ink">التركيز</text>
    <g transform="translate(30 250)"><rect width="360" height="62" rx="11" class="card"/><text x="330" y="27" text-anchor="end" class="t body ink">تقليل الحركة</text><text x="330" y="48" text-anchor="end" class="t small muted">احترم إعداد النظام</text><rect x="32" y="18" width="46" height="28" rx="14" class="accent"/><circle cx="63" cy="32" r="10" class="white"/></g>
    <text x="390" y="356" text-anchor="end" class="t h2 ink">ملكية البيانات</text>
    <g transform="translate(30 376)"><rect width="360" height="72" rx="11" class="card"/><text x="330" y="29" text-anchor="end" class="t body ink">تصدير نسخة كاملة</text><text x="330" y="51" text-anchor="end" class="t small muted">JSON أو Markdown</text><text x="28" y="41" class="t small accent">تصدير</text><rect y="84" width="360" height="72" rx="11" class="card"/><text x="330" y="113" text-anchor="end" class="t body ink">استيراد نسخة</text><text x="330" y="135" text-anchor="end" class="t small muted">سنفحصها ونعرض ملخصًا قبل الاستبدال</text><text x="28" y="125" class="t small accent">اختيار ملف</text></g>
    <rect x="30" y="558" width="360" height="64" rx="11" class="dangerSoft"/><text x="370" y="584" text-anchor="end" class="t body danger">تعذر استيراد الملف</text><text x="370" y="607" text-anchor="end" class="t small muted">لم تتغير بياناتك الحالية. جرّب نسخة صالحة.</text>
    <text x="210" y="684" text-anchor="middle" class="t tiny muted">كل البيانات محفوظة على هذا الجهاز</text>
  </g>
</svg>
