<svg xmlns="http://www.w3.org/2000/svg" width="420" height="730" viewBox="0 0 420 730">
<defs>
    <style>
      .canvas{fill:#e9e2d5}.panel{fill:#fffdf8;stroke:#d8cebd;stroke-width:1}.bar{fill:#f6f0e5}.ink{fill:#18212b}.muted{fill:#66707a}.accent{fill:#3154a5}.accentSoft{fill:#e8edfa}.success{fill:#1f7257}.successSoft{fill:#e4f2ec}.warn{fill:#9b5a1d}.warnSoft{fill:#fff0d8}.danger{fill:#ad3b42}.dangerSoft{fill:#fae9ea}.rule{stroke:#d8cebd;stroke-width:1}.focus{fill:none;stroke:#3154a5;stroke-width:3}.card{fill:#fffdf8;stroke:#d8cebd;stroke-width:1}.dark{fill:#18212b}.white{fill:#fffdf8}.t{font-family:'Cairo',sans-serif;direction:rtl;unicode-bidi:plaintext}.h1{font-size:25px;font-weight:700}.h2{font-size:19px;font-weight:700}.body{font-size:14px;font-weight:500}.small{font-size:12px;font-weight:500}.tiny{font-size:10px;font-weight:600;letter-spacing:.3px}.num{font-family:'Cairo',sans-serif;font-variant-numeric:tabular-nums}.button{fill:#3154a5}.buttonText{fill:#fffdf8;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;direction:rtl}.outline{fill:#fffdf8;stroke:#3154a5;stroke-width:1.5}.field{fill:#fffdf8;stroke:#bdb3a3;stroke-width:1.2}.screenLabel{font-family:'Cairo',sans-serif;font-size:15px;font-weight:700;fill:#39424c;direction:rtl}.chip{fill:#eef1f4}.dot{fill:#3154a5}.coverA{fill:#3154a5}.coverB{fill:#b56924}.coverC{fill:#4b7a69}
    </style>
  </defs>
<g transform="translate(0 0)">
    <text x="420" y="-18" text-anchor="end" class="screenLabel">08 — ملخص الجلسة</text>
    <rect class="panel" width="420" height="730" rx="16"/>
    <rect class="bar" width="420" height="76" rx="16"/><rect class="bar" y="56" width="420" height="20"/>
    <text x="390" y="34" text-anchor="end" class="t h2 ink">أحسنت — اكتملت الجلسة</text><text x="390" y="58" text-anchor="end" class="t small muted">تم الحفظ محليًا • اليوم 10:42 ص</text>
    <g transform="translate(30 100)"><rect width="360" height="104" rx="14" class="successSoft"/><circle cx="326" cy="50" r="22" class="success"/><path d="M315 50l8 8 16-20" fill="none" stroke="#fff" stroke-width="4"/><text x="286" y="42" text-anchor="end" class="t h2 ink">18 صفحة • 61 دقيقة</text><text x="286" y="69" text-anchor="end" class="t small muted">اكتملت خطوات الاسترجاع والشرح</text></g>
    <text x="390" y="244" text-anchor="end" class="t h2 ink">حصيلة التعلم</text>
    <g transform="translate(30 264)"><rect width="110" height="88" rx="12" class="card"/><text x="55" y="35" text-anchor="middle" class="num" font-size="24" font-weight="700" fill="#3154a5">2</text><text x="55" y="61" text-anchor="middle" class="t small muted">تطبيقات</text><rect x="125" width="110" height="88" rx="12" class="card"/><text x="180" y="35" text-anchor="middle" class="num" font-size="24" font-weight="700" fill="#9b5a1d">1</text><text x="180" y="61" text-anchor="middle" class="t small muted">فجوة</text><rect x="250" width="110" height="88" rx="12" class="card"/><text x="305" y="35" text-anchor="middle" class="num" font-size="24" font-weight="700" fill="#1f7257">4</text><text x="305" y="61" text-anchor="middle" class="t small muted">أفكار</text></g>
    <text x="390" y="397" text-anchor="end" class="t h2 ink">ما التالي؟</text><rect x="30" y="418" width="360" height="108" rx="14" class="accentSoft"/><text x="370" y="450" text-anchor="end" class="t body accent">الجلسة القادمة</text><text x="370" y="478" text-anchor="end" class="t body ink">راجع الفجوة ثم اقرأ ص 103–120</text><text x="370" y="503" text-anchor="end" class="t small muted">مقترحة غدًا • 60 دقيقة</text>
    <rect x="30" y="642" width="360" height="48" rx="10" class="button"/><text x="210" y="672" text-anchor="middle" class="buttonText">عرض تقدم الكتاب</text>
  </g>
