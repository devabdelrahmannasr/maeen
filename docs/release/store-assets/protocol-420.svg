    <text x="390" y="230" text-anchor="end" class="t h2 ink">خطوات الجلسة</text>
    <g transform="translate(48 250)">
      <line x1="314" y1="15" x2="314" y2="296" stroke="#c9c1b4" stroke-width="2"/>
      <circle cx="314" cy="18" r="13" class="accent"/><text x="314" y="23" text-anchor="middle" fill="#fff" class="t small">1</text><text x="287" y="17" text-anchor="end" class="t body ink">معاينة وبناء أسئلة</text><text x="287" y="38" text-anchor="end" class="t small muted">5 دقائق</text>
      <circle cx="314" cy="82" r="13" class="accent"/><text x="314" y="87" text-anchor="middle" fill="#fff" class="t small">2</text><text x="287" y="81" text-anchor="end" class="t body ink">قراءة مركّزة</text><text x="287" y="102" text-anchor="end" class="t small muted">50 دقيقة • ص 84–102</text>
      <circle cx="314" cy="146" r="13" class="accent"/><text x="314" y="151" text-anchor="middle" fill="#fff" class="t small">3</text><text x="287" y="145" text-anchor="end" class="t body ink">استرجاع من الذاكرة</text><text x="287" y="166" text-anchor="end" class="t small muted">7 دقائق</text>
      <circle cx="314" cy="210" r="13" class="accent"/><text x="314" y="215" text-anchor="middle" fill="#fff" class="t small">4</text><text x="287" y="209" text-anchor="end" class="t body ink">اشرح الفكرة ببساطة</text><text x="287" y="230" text-anchor="end" class="t small muted">5 دقائق</text>
      <circle cx="314" cy="274" r="13" class="accent"/><text x="314" y="279" text-anchor="middle" fill="#fff" class="t small">5</text><text x="287" y="273" text-anchor="end" class="t body ink">راجع وسجّل تطبيقًا</text><text x="287" y="294" text-anchor="end" class="t small muted">8 دقائق</text>
