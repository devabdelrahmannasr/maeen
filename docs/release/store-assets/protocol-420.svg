    <text x="390" y="34" text-anchor="end" class="t h2 ink">بروتوكولك المقترح</text><text x="390" y="57" text-anchor="end" class="t small muted">Deep Technical Reading • نسخة 1.0</text>
    <g transform="translate(30 94)">
      <rect width="360" height="98" rx="14" class="dark"/><text x="330" y="31" text-anchor="end" class="t small" fill="#b7c3e5">لأن هدفك هو الفهم العميق</text><text x="330" y="60" text-anchor="end" class="t h2 white">اقرأ 18 صفحة في 50 دقيقة</text><text x="330" y="82" text-anchor="end" class="t small" fill="#d6dce9">ثم استرجع واشرح وراجع</text>
