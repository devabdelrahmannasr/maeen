<svg xmlns="http://www.w3.org/2000/svg" width="420" height="730" viewBox="0 0 420 730">
<defs>
    <style>
      .canvas{fill:#e9e2d5}.panel{fill:#fffdf8;stroke:#d8cebd;stroke-width:1}.bar{fill:#f6f0e5}.ink{fill:#18212b}.muted{fill:#66707a}.accent{fill:#3154a5}.accentSoft{fill:#e8edfa}.success{fill:#1f7257}.successSoft{fill:#e4f2ec}.warn{fill:#9b5a1d}.warnSoft{fill:#fff0d8}.danger{fill:#ad3b42}.dangerSoft{fill:#fae9ea}.rule{stroke:#d8cebd;stroke-width:1}.focus{fill:none;stroke:#3154a5;stroke-width:3}.card{fill:#fffdf8;stroke:#d8cebd;stroke-width:1}.dark{fill:#18212b}.white{fill:#fffdf8}.t{font-family:'Cairo',sans-serif;direction:rtl;unicode-bidi:plaintext}.h1{font-size:25px;font-weight:700}.h2{font-size:19px;font-weight:700}.body{font-size:14px;font-weight:500}.small{font-size:12px;font-weight:500}.tiny{font-size:10px;font-weight:600;letter-spacing:.3px}.num{font-family:'Cairo',sans-serif;font-variant-numeric:tabular-nums}.button{fill:#3154a5}.buttonText{fill:#fffdf8;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;direction:rtl}.outline{fill:#fffdf8;stroke:#3154a5;stroke-width:1.5}.field{fill:#fffdf8;stroke:#bdb3a3;stroke-width:1.2}.screenLabel{font-family:'Cairo',sans-serif;font-size:15px;font-weight:700;fill:#39424c;direction:rtl}.chip{fill:#eef1f4}.dot{fill:#3154a5}.coverA{fill:#3154a5}.coverB{fill:#b56924}.coverC{fill:#4b7a69}
    </style>
  </defs>
<g transform="translate(0 0)">
    <text x="420" y="-18" text-anchor="end" class="screenLabel">06 — جلسة التركيز</text>
    <rect class="panel" width="420" height="730" rx="16"/>
    <rect class="bar" width="420" height="74" rx="16"/><rect class="bar" y="54" width="420" height="20"/>
    <text x="390" y="32" text-anchor="end" class="t body ink">Clean Architecture</text><text x="390" y="56" text-anchor="end" class="t small muted">الخطوة 2 من 5 • قراءة مركزة</text><text x="30" y="43" class="t small accent">إيقاف مؤقت</text>
    <text x="210" y="172" text-anchor="middle" class="num" font-family="Cairo" font-size="58" font-weight="700" fill="#18212b">42:18</text><text x="210" y="201" text-anchor="middle" class="t small muted">متبقٍ من 50 دقيقة</text>
    <rect x="30" y="232" width="360" height="104" rx="14" class="accentSoft"/><text x="370" y="263" text-anchor="end" class="t body accent">الآن</text><text x="370" y="291" text-anchor="end" class="t h2 ink">اقرأ الصفحات 84–102</text><text x="370" y="316" text-anchor="end" class="t small muted">ابحث عن حدود المسؤولية بين الطبقات.</text>
    <text x="390" y="382" text-anchor="end" class="t body ink">ملاحظة سريعة</text><rect x="30" y="396" width="360" height="112" rx="10" class="field"/><text x="370" y="426" text-anchor="end" class="t body muted">اكتب فكرة أو سؤالًا دون مغادرة الجلسة…</text>
    <g transform="translate(30 536)"><rect width="172" height="44" rx="9" class="outline"/><text x="86" y="28" text-anchor="middle" class="t body accent">سجّل تشتتًا</text><rect x="188" width="172" height="44" rx="9" class="outline"/><text x="274" y="28" text-anchor="middle" class="t body accent">أضف سؤالًا</text></g>
    <rect x="30" y="642" width="360" height="48" rx="10" class="button"/><text x="210" y="672" text-anchor="middle" class="buttonText">أنهي القراءة وانتقل للاسترجاع</text>
