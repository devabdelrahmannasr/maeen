<svg xmlns="http://www.w3.org/2000/svg" width="420" height="730" viewBox="0 0 420 730">
<defs>
    <style>
      .canvas{fill:#e9e2d5}.panel{fill:#fffdf8;stroke:#d8cebd;stroke-width:1}.bar{fill:#f6f0e5}.ink{fill:#18212b}.muted{fill:#66707a}.accent{fill:#3154a5}.accentSoft{fill:#e8edfa}.success{fill:#1f7257}.successSoft{fill:#e4f2ec}.warn{fill:#9b5a1d}.warnSoft{fill:#fff0d8}.danger{fill:#ad3b42}.dangerSoft{fill:#fae9ea}.rule{stroke:#d8cebd;stroke-width:1}.focus{fill:none;stroke:#3154a5;stroke-width:3}.card{fill:#fffdf8;stroke:#d8cebd;stroke-width:1}.dark{fill:#18212b}.white{fill:#fffdf8}.t{font-family:'Cairo',sans-serif;direction:rtl;unicode-bidi:plaintext}.h1{font-size:25px;font-weight:700}.h2{font-size:19px;font-weight:700}.body{font-size:14px;font-weight:500}.small{font-size:12px;font-weight:500}.tiny{font-size:10px;font-weight:600;letter-spacing:.3px}.num{font-family:'Cairo',sans-serif;font-variant-numeric:tabular-nums}.button{fill:#3154a5}.buttonText{fill:#fffdf8;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;direction:rtl}.outline{fill:#fffdf8;stroke:#3154a5;stroke-width:1.5}.field{fill:#fffdf8;stroke:#bdb3a3;stroke-width:1.2}.screenLabel{font-family:'Cairo',sans-serif;font-size:15px;font-weight:700;fill:#39424c;direction:rtl}.chip{fill:#eef1f4}.dot{fill:#3154a5}.coverA{fill:#3154a5}.coverB{fill:#b56924}.coverC{fill:#4b7a69}
    </style>
  </defs>
<g transform="translate(0 0)">
    <text x="420" y="-18" text-anchor="end" class="screenLabel">07 — الاسترجاع والشرح</text>
    <rect class="panel" width="420" height="730" rx="16"/>
    <rect class="bar" width="420" height="72" rx="16"/><rect class="bar" y="54" width="420" height="18"/>
    <text x="390" y="34" text-anchor="end" class="t h2 ink">استرجع قبل أن تراجع</text><text x="390" y="57" text-anchor="end" class="t small muted">الخطوة 3 من 5 • بدون الرجوع للكتاب</text>
    <text x="390" y="114" text-anchor="end" class="t body ink">ما أهم ثلاث أفكار تتذكرها؟</text><rect x="30" y="130" width="360" height="168" rx="10" class="field"/>
    <text x="370" y="162" text-anchor="end" class="t body ink">1. حدود الطبقات تمنع تسرب التفاصيل.</text><text x="370" y="196" text-anchor="end" class="t body ink">2. الاعتماد يتجه نحو السياسات.</text><text x="370" y="230" text-anchor="end" class="t body muted">3. …</text>
    <text x="390" y="342" text-anchor="end" class="t body ink">اشرح الفكرة كأنك تعلّمها لشخص آخر</text><rect x="30" y="358" width="360" height="136" rx="10" class="field"/><text x="370" y="390" text-anchor="end" class="t body muted">اكتب شرحًا بسيطًا، وحدد أين توقفت…</text>
    <rect x="30" y="520" width="360" height="72" rx="11" class="warnSoft"/><text x="370" y="548" text-anchor="end" class="t body warn">وجدت فجوة في الفهم؟</text><text x="370" y="572" text-anchor="end" class="t small muted">سجّلها الآن وسنضعها في المراجعة.</text><text x="48" y="561" class="t small warn">سجّل فجوة</text>
    <rect x="30" y="642" width="360" height="48" rx="10" class="button"/><text x="210" y="672" text-anchor="middle" class="buttonText">احفظ وانتقل للمراجعة</text>
  </g>
</svg>
