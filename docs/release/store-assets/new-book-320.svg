<svg xmlns="http://www.w3.org/2000/svg" width="420" height="730" viewBox="0 0 420 730">
<defs>
    <style>
      .canvas{fill:#e9e2d5}.panel{fill:#fffdf8;stroke:#d8cebd;stroke-width:1}.bar{fill:#f6f0e5}.ink{fill:#18212b}.muted{fill:#66707a}.accent{fill:#3154a5}.accentSoft{fill:#e8edfa}.success{fill:#1f7257}.successSoft{fill:#e4f2ec}.warn{fill:#9b5a1d}.warnSoft{fill:#fff0d8}.danger{fill:#ad3b42}.dangerSoft{fill:#fae9ea}.rule{stroke:#d8cebd;stroke-width:1}.focus{fill:none;stroke:#3154a5;stroke-width:3}.card{fill:#fffdf8;stroke:#d8cebd;stroke-width:1}.dark{fill:#18212b}.white{fill:#fffdf8}.t{font-family:'Cairo',sans-serif;direction:rtl;unicode-bidi:plaintext}.h1{font-size:25px;font-weight:700}.h2{font-size:19px;font-weight:700}.body{font-size:14px;font-weight:500}.small{font-size:12px;font-weight:500}.tiny{font-size:10px;font-weight:600;letter-spacing:.3px}.num{font-family:'Cairo',sans-serif;font-variant-numeric:tabular-nums}.button{fill:#3154a5}.buttonText{fill:#fffdf8;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;direction:rtl}.outline{fill:#fffdf8;stroke:#3154a5;stroke-width:1.5}.field{fill:#fffdf8;stroke:#bdb3a3;stroke-width:1.2}.screenLabel{font-family:'Cairo',sans-serif;font-size:15px;font-weight:700;fill:#39424c;direction:rtl}.chip{fill:#eef1f4}.dot{fill:#3154a5}.coverA{fill:#3154a5}.coverB{fill:#b56924}.coverC{fill:#4b7a69}
    </style>
  </defs>
<g transform="translate(0 0)">
    <text x="420" y="-18" text-anchor="end" class="screenLabel">03 — إضافة كتاب</text>
    <rect class="panel" width="420" height="730" rx="16"/>
    <rect class="bar" width="420" height="66" rx="16"/><rect class="bar" y="48" width="420" height="18"/>
    <text x="390" y="41" text-anchor="end" class="t h2 ink">كتاب جديد</text><text x="30" y="41" class="t body accent">إلغاء</text>
    <text x="390" y="106" text-anchor="end" class="t body ink">عنوان الكتاب</text><rect x="30" y="120" width="360" height="48" rx="9" class="field"/><text x="370" y="150" text-anchor="end" class="t body ink">Designing Data-Intensive Applications</text>
    <text x="390" y="204" text-anchor="end" class="t body ink">المؤلف <tspan class="muted">(اختياري)</tspan></text><rect x="30" y="218" width="360" height="48" rx="9" class="field"/><text x="370" y="248" text-anchor="end" class="t body muted">Martin Kleppmann</text>
    <text x="390" y="302" text-anchor="end" class="t body ink">عدد الصفحات</text><rect x="210" y="316" width="180" height="48" rx="9" class="field"/><text x="370" y="346" text-anchor="end" class="t body ink num">616</text>
    <text x="190" y="302" text-anchor="end" class="t body ink">صفحتك الحالية</text><rect x="30" y="316" width="160" height="48" rx="9" class="field"/><text x="170" y="346" text-anchor="end" class="t body ink num">1</text>
    <rect x="30" y="399" width="360" height="84" rx="12" class="accentSoft"/><text x="370" y="425" text-anchor="end" class="t body accent">اكتشفنا PDF مفتوحًا</text><text x="370" y="450" text-anchor="end" class="t small muted">العنوان والرابط فقط؛ لن نقرأ محتوى الملف.</text><text x="370" y="470" text-anchor="end" class="t small muted">يمكنك تعديل البيانات قبل الحفظ.</text>
    <rect x="30" y="642" width="360" height="48" rx="10" class="button"/><text x="210" y="672" text-anchor="middle" class="buttonText">احفظ واختر هدفك</text>
