    <text x="388" y="41" text-anchor="end" class="t h2 ink">معين</text><circle cx="31" cy="32" r="5" class="success"/>
    <g transform="translate(30 102)">
      <rect width="360" height="180" rx="14" class="dark"/>
      <path d="M54 44h108v92H54zM198 44h108v92H198" fill="none" stroke="#f6f0e5" stroke-width="2"/>
      <path d="M180 40v102" stroke="#7e91c8" stroke-width="2"/>
      <circle cx="180" cy="92" r="20" fill="#3154a5"/>
      <path d="M171 92l7 7 13-16" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="390" y="330" text-anchor="end" class="t h1 ink">اقرأ بهدف واضح</text>
    <text x="390" y="361" text-anchor="end" class="t body muted">اختر لماذا تقرأ، وسنرتّب لك جلسة واحدة</text>
    <text x="390" y="383" text-anchor="end" class="t body muted">تساعدك على الفهم والاسترجاع والتطبيق.</text>
