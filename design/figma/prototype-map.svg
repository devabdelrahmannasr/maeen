<g transform="translate(40 150)"><text x="330" y="-16" text-anchor="end" class="t h ink">1. البداية</text><rect width="330" height="380" rx="14" class="screen"/><rect width="330" height="52" rx="14" class="top"/><text x="305" y="33" text-anchor="end" class="t body ink">مرافق القراءة</text><rect x="24" y="78" width="282" height="118" rx="11" class="dark"/><text x="282" y="116" text-anchor="end" class="t small" fill="#b7c3e5">محلي وخاص</text><text x="282" y="148" text-anchor="end" class="t h white">اقرأ بهدف واضح</text><text x="282" y="174" text-anchor="end" class="t small" fill="#d6dce9">لا حساب ولا سحابة</text><rect x="24" y="310" width="282" height="42" rx="9" class="btn"/><text x="165" y="337" text-anchor="middle" class="t body white">ابدأ محليًا</text></g>
