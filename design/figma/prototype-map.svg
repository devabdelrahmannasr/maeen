<g transform="translate(455 150)"><text x="325" y="-16" text-anchor="end" class="t h ink">2. المكتبة</text><rect width="325" height="380" rx="14" class="screen"/><text x="300" y="38" text-anchor="end" class="t h ink">مكتبتي</text><rect x="22" y="68" width="281" height="58" rx="9" class="amberS"/><text x="285" y="93" text-anchor="end" class="t small amber">جلسة متوقفة بأمان</text><text x="285" y="114" text-anchor="end" class="t tiny muted">استكمل من آخر نقطة</text><rect x="22" y="146" width="281" height="108" rx="11" class="paper"/><rect x="245" y="162" width="38" height="54" rx="4" class="blue"/><text x="230" y="177" text-anchor="end" class="t small ink">Clean Architecture</text><text x="230" y="199" text-anchor="end" class="t tiny muted">ص 84–102 • 44%</text><rect x="22" y="310" width="281" height="42" rx="9" class="btn"/><text x="162" y="337" text-anchor="middle" class="t body white">أضف كتابًا</text></g>
