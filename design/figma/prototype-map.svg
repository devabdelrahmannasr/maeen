<svg xmlns="http://www.w3.org/2000/svg" width="2460" height="1500" viewBox="0 0 2460 1500">
<defs><style>
.bg{fill:#e9e2d5}.paper{fill:#fffdf8;stroke:#d8cebd;stroke-width:1}.ink{fill:#18212b}.muted{fill:#66707a}.blue{fill:#3154a5}.blueS{fill:#e8edfa}.green{fill:#1f7257}.greenS{fill:#e4f2ec}.amber{fill:#9b5a1d}.amberS{fill:#fff0d8}.red{fill:#ad3b42}.line{stroke:#8c96a0;stroke-width:2;fill:none;marker-end:url(#arrow)}.branch{stroke:#b56924;stroke-width:2;fill:none;stroke-dasharray:8 6;marker-end:url(#arrowA)}.t{font-family:'Cairo',sans-serif;direction:rtl;unicode-bidi:plaintext}.title{font-size:34px;font-weight:800}.h{font-size:17px;font-weight:700}.body{font-size:13px;font-weight:500}.small{font-size:11px;font-weight:500}.tiny{font-size:9px;font-weight:600}.btn{fill:#3154a5}.screen{fill:#fffdf8;stroke:#c9bfaf;stroke-width:1.2}.top{fill:#f6f0e5}.dark{fill:#18212b}.white{fill:#fffdf8}
</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#8c96a0"/></marker><marker id="arrowA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#b56924"/></marker></defs>
<rect class="bg" width="2460" height="1500"/><text x="2380" y="64" text-anchor="end" class="t title ink">خريطة الـprototype النهائي</text><text x="2380" y="96" text-anchor="end" class="t body muted">المسار الأساسي، الاستعادة، والتحقق من البيانات — كل قرار ينتج خطوة واحدة واضحة</text>

