<path d="M2257 530V610H2010" class="line"/><path d="M1685 795H1600" class="line"/><path d="M1275 795H1190" class="line"/><path d="M865 795H780" class="line"/>
<g transform="translate(1685 610)"><text x="325" y="-16" text-anchor="end" class="t h ink">7. الاسترجاع</text><rect width="325" height="380" rx="14" class="screen"/><text x="300" y="38" text-anchor="end" class="t h ink">استرجع قبل أن تراجع</text><text x="300" y="82" text-anchor="end" class="t small ink">أهم ثلاث أفكار</text><rect x="22" y="96" width="281" height="120" rx="9" class="paper"/><text x="282" y="127" text-anchor="end" class="t small ink">1. حدود الطبقات</text><text x="282" y="157" text-anchor="end" class="t small ink">2. اتجاه الاعتماد</text><text x="282" y="187" text-anchor="end" class="t small muted">3. …</text><rect x="22" y="230" width="281" height="60" rx="9" class="amberS"/><text x="282" y="266" text-anchor="end" class="t small amber">سجّل فجوة للفحص</text><rect x="22" y="310" width="281" height="42" rx="9" class="btn"/><text x="162" y="337" text-anchor="middle" class="t body white">انتقل للمراجعة</text></g>
<g transform="translate(1275 610)"><text x="325" y="-16" text-anchor="end" class="t h ink">8. المراجعة والتطبيق</text><rect width="325" height="380" rx="14" class="screen"/><text x="300" y="38" text-anchor="end" class="t h ink">راجع فجواتك</text><rect x="22" y="72" width="281" height="72" rx="10" class="amberS"/><text x="282" y="101" text-anchor="end" class="t small amber">حدود الـUse Cases</text><text x="282" y="125" text-anchor="end" class="t tiny muted">ارجع إلى ص 96 ثم اشرح الفرق</text><text x="300" y="186" text-anchor="end" class="t small ink">تطبيق عملي واحد</text><rect x="22" y="198" width="281" height="88" rx="9" class="paper"/><text x="282" y="230" text-anchor="end" class="t small muted">ما الذي ستجرّبه بعد القراءة؟</text><rect x="22" y="310" width="281" height="42" rx="9" class="btn"/><text x="162" y="337" text-anchor="middle" class="t body white">أكمل الجلسة</text></g>
<g transform="translate(865 610)"><text x="325" y="-16" text-anchor="end" class="t h ink">9. الملخص</text><rect width="325" height="380" rx="14" class="screen"/><text x="300" y="38" text-anchor="end" class="t h ink">اكتملت الجلسة</text><rect x="22" y="70" width="281" height="76" rx="10" class="greenS"/><text x="282" y="101" text-anchor="end" class="t h green">18 صفحة • 61 دقيقة</text><text x="282" y="127" text-anchor="end" class="t tiny muted">كل شيء محفوظ محليًا</text><text x="300" y="190" text-anchor="end" class="t small ink">4 أفكار • فجوة • تطبيقان</text><rect x="22" y="218" width="281" height="72" rx="10" class="blueS"/><text x="282" y="248" text-anchor="end" class="t small blue">التالي: ص 103–120</text><text x="282" y="272" text-anchor="end" class="t tiny muted">مقترحة غدًا • 60 دقيقة</text><rect x="22" y="310" width="281" height="42" rx="9" class="btn"/><text x="162" y="337" text-anchor="middle" class="t body white">عرض التقدم</text></g>
<g transform="translate(455 610)"><text x="325" y="-16" text-anchor="end" class="t h ink">10. تقدم الكتاب</text><rect width="325" height="380" rx="14" class="screen"/><text x="300" y="38" text-anchor="end" class="t h ink">Clean Architecture</text><text x="300" y="78" text-anchor="end" class="t small ink">التقدم 44%</text><rect x="22" y="90" width="281" height="7" rx="3" fill="#e2ded6"/><rect x="180" y="90" width="123" height="7" rx="3" class="blue"/><rect x="22" y="132" width="281" height="74" rx="10" class="amberS"/><text x="282" y="162" text-anchor="end" class="t small amber">فجوة تحتاج مراجعة</text><text x="282" y="186" text-anchor="end" class="t tiny muted">حدود الـUse Cases • ص 96</text><rect x="22" y="222" width="281" height="68" rx="10" class="paper"/><text x="282" y="250" text-anchor="end" class="t small ink">الجلسة القادمة</text><text x="282" y="274" text-anchor="end" class="t tiny muted">ص 103–120 • 60 دقيقة</text><rect x="22" y="310" width="281" height="42" rx="9" class="btn"/><text x="162" y="337" text-anchor="middle" class="t body white">ابدأ الجلسة التالية</text></g>

