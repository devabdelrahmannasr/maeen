<text x="2380" y="1070" text-anchor="end" class="t h ink">المسارات البديلة الآمنة</text>
<path d="M617 530V1115H450" class="branch"/><path d="M2257 530V1115H1220" class="branch"/><path d="M617 990V1115H1950" class="branch"/>
<g transform="translate(40 1130)"><rect width="600" height="240" rx="16" class="paper"/><text x="570" y="40" text-anchor="end" class="t h amber">استعادة جلسة منقطعة</text><text x="570" y="78" text-anchor="end" class="t body ink">عودة إلى آخر خطوة آمنة مع الوقت والملاحظات المحفوظة.</text><rect x="300" y="116" width="270" height="42" rx="9" class="btn"/><text x="435" y="143" text-anchor="middle" class="t body white">استكمل من آخر نقطة</text><rect x="30" y="116" width="240" height="42" rx="9" fill="#fff" stroke="#3154a5"/><text x="150" y="143" text-anchor="middle" class="t body blue">ابدأ جلسة جديدة</text><text x="570" y="204" text-anchor="end" class="t small muted">لا تُحتسب Completed قبل إنهاء Review.</text></g>
<g transform="translate(720 1130)"><rect width="760" height="240" rx="16" class="paper"/><text x="730" y="40" text-anchor="end" class="t h amber">تصحيح الهدف أو البيانات</text><text x="730" y="78" text-anchor="end" class="t body ink">التعارض أو التحقق لا يغير الحالة الصحيحة السابقة.</text><rect x="410" y="112" width="320" height="80" rx="10" class="amberS"/><text x="710" y="142" text-anchor="end" class="t small amber">السرعة تتعارض مع الفهم العميق</text><text x="710" y="168" text-anchor="end" class="t tiny muted">اعتمد الهدف الرئيسي أو عدّل الاختيار.</text><rect x="30" y="112" width="350" height="80" rx="10" fill="#fae9ea"/><text x="360" y="142" text-anchor="end" class="t small red">عدد الصفحات غير صالح</text><text x="360" y="168" text-anchor="end" class="t tiny muted">صحّح الحقل؛ لم يُحفظ شيء بعد.</text></g>
<g transform="translate(1560 1130)"><rect width="860" height="240" rx="16" class="paper"/><text x="830" y="40" text-anchor="end" class="t h green">استيراد آمن</text><text x="830" y="78" text-anchor="end" class="t body ink">Validate → Migrate → Preview → Backup → Commit</text><circle cx="780" cy="132" r="20" class="blue"/><text x="780" y="137" text-anchor="middle" class="t small white">1</text><circle cx="620" cy="132" r="20" class="blue"/><text x="620" y="137" text-anchor="middle" class="t small white">2</text><circle cx="460" cy="132" r="20" class="blue"/><text x="460" y="137" text-anchor="middle" class="t small white">3</text><circle cx="300" cy="132" r="20" class="blue"/><text x="300" y="137" text-anchor="middle" class="t small white">4</text><circle cx="140" cy="132" r="20" class="green"/><text x="140" y="137" text-anchor="middle" class="t small white">5</text><path d="M760 132H642M600 132H482M440 132H322M280 132H162" class="line"/><text x="830" y="204" text-anchor="end" class="t small muted">عند الفشل: لا استبدال، تبقى البيانات الحالية، وتظهر خطوة استعادة واضحة.</text></g>
