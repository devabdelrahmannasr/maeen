<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<style>.bg{fill:#18212b}.paper{fill:#fffdf8}.blue{fill:#7896ea}.muted{fill:#b7c1ca}.line{stroke:#3a4855}.t{font-family:'Cairo',sans-serif;direction:rtl;unicode-bidi:plaintext}.title{font-size:62px;font-weight:800}.h{font-size:23px;font-weight:700}.body{font-size:16px;font-weight:500}.small{font-size:13px;font-weight:500}.tag{fill:#263746;stroke:#526374}.green{fill:#77c8a8}</style>
<rect class="bg" width="1440" height="900"/><rect x="80" y="72" width="1280" height="756" rx="22" fill="#101820" stroke="#344451"/>
<text x="1290" y="185" text-anchor="end" class="t title paper">معين</text><text x="1290" y="230" text-anchor="end" class="t h blue">قل لي لماذا تقرأ، وسأرتب لك كيف تقرأ.</text><text x="1290" y="282" text-anchor="end" class="t body muted">Arabic RTL • Local-first • Chrome &amp; Edge Side Panel • UI v1.0</text>
<line x1="150" y1="330" x2="1290" y2="330" class="line"/>
<text x="1290" y="390" text-anchor="end" class="t h paper">ابدأ من هنا</text>
<g transform="translate(150 430)"><rect x="855" width="285" height="92" rx="14" class="tag"/><text x="1114" y="34" text-anchor="end" class="t body paper">01 — Foundations</text><text x="1114" y="64" text-anchor="end" class="t small muted">Tokens + Components</text><rect x="570" width="255" height="92" rx="14" class="tag"/><text x="799" y="34" text-anchor="end" class="t body paper">02 — MVP Screens</text><text x="799" y="64" text-anchor="end" class="t small muted">10 core screens</text><rect x="275" width="265" height="92" rx="14" class="tag"/><text x="514" y="34" text-anchor="end" class="t body paper">03 — States</text><text x="514" y="64" text-anchor="end" class="t small muted">Dark + Responsive</text><rect width="245" height="92" rx="14" class="tag"/><text x="219" y="34" text-anchor="end" class="t body paper">04 — Prototype</text><text x="219" y="64" text-anchor="end" class="t small muted">Flow + recovery</text></g>
<text x="1290" y="600" text-anchor="end" class="t h paper">مبادئ التسليم</text><text x="1290" y="646" text-anchor="end" class="t body muted">• Goal-first، ثم خطوة واحدة واضحة في كل لحظة.</text><text x="1290" y="684" text-anchor="end" class="t body muted">• البيانات محلية، قابلة للاستعادة، ومملوكة للمستخدم.</text><text x="1290" y="722" text-anchor="end" class="t body muted">• Cairo وRTL فعلي، تباين AA، تركيز ظاهر، وتقليل حركة.</text><circle cx="169" cy="690" r="8" class="green"/><text x="194" y="696" class="t small green">Source synced: Notion Spec + Product HQ workflows</text>
<text x="1290" y="794" text-anchor="end" class="t small muted">Design direction: Arabic print-proof precision — warm paper, dark ink, indigo action.</text>
</svg>
